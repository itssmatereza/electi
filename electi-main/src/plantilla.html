<script>
/* Compatibilidad con los enlaces antiguos que llevaban # (QR, bios, mensajes ya enviados).
   Se ejecuta antes de dibujar la página, así que el visitante no ve el salto.
   Cuando esos enlaces dejen de circular, este bloque se puede borrar. */
(function(){
  if (location.pathname !== '/' || !location.hash) return;
  var M = {'home':'/','programa':'/programa/','docentes':'/docentes/','becas':'/becas/',
           'preguntas':'/preguntas/','sedes':'/sedes/','sede-quito':'/quito/',
           'sede-guayaquil':'/guayaquil/','sede-cuenca':'/cuenca/',
           'sede-santo-domingo':'/santodomingo/','instituciones':'/colegios/',
           'ue':'/institucional/','uide':'/uide/'};
  var p = location.hash.replace('#','').split('/');
  var destino = M[p[0]];
  if (destino && destino !== '/') location.replace(destino + (p[1] ? '#' + p[1] : ''));
})();
</script>
